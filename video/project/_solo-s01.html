<!doctype html>
<!-- 生成物（tools/build.mjs）。手で編集しない。シーンは scenes/<id>.js、共通部品は scenes/lib.js -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* 共通の見た目。build.mjs が index.html に埋め込む（@font-face は同じファイル内に必要＝lint の規則） */
      @font-face { font-family: "Dela"; src: url("assets/fonts/DelaGothicOne-400.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Mincho"; src: url("assets/fonts/ShipporiMinchoB1-400.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Mincho"; src: url("assets/fonts/ShipporiMinchoB1-700.ttf") format("truetype"); font-weight: 700; }
      @font-face { font-family: "Klee"; src: url("assets/fonts/KleeOne-600.ttf") format("truetype"); font-weight: 600; }
      @font-face { font-family: "ZenKaku"; src: url("assets/fonts/ZenKakuGothicNew-500.ttf") format("truetype"); font-weight: 500; }
      @font-face { font-family: "ZenKaku"; src: url("assets/fonts/ZenKakuGothicNew-900.ttf") format("truetype"); font-weight: 900; }

      :root {
        --paper: #F3EEE3; --ink: #14110F; --red: #E5321B; --blue: #2442FF; --yellow: #FFD02E;
        --f-slam: "Dela", sans-serif;      /* 叩きつけ見出し・数字（動画の声） */
        --f-mincho: "Mincho", serif;       /* 原稿の本文・出力カード */
        --f-pen: "Klee", sans-serif;       /* 赤ペンの書き込み */
        --f-ui: "ZenKaku", sans-serif;     /* UI・札・小さな補足 */
        --min-read: 50px;                  /* 読ませる字の下限（画面高 0.045 = 48.6px） */
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
      .hf-stage { position: absolute; inset: 0; width: 100%; height: 100%; }
      .hf-layer { position: absolute; inset: 0; width: 100%; height: 100%; }
      .hf-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .hf-hidden { opacity: 0; }

      /* 背景 */
      .hf-bg { position: absolute; inset: 0; background: var(--paper); }
      .hf-paper {
        background-color: var(--paper);
        background-image: repeating-linear-gradient(to bottom, transparent 0 95px, rgba(20, 17, 15, 0.07) 95px 97px);
      }
      .hf-ink { background-color: var(--ink); }

      /* 動画の声（叩きつけ） */
      .hf-voice { display: block; font-family: var(--f-slam); font-weight: 400; color: var(--ink); line-height: 1.1; white-space: nowrap; }

      /* 札 */
      .hf-tag {
        display: inline-block; font-family: var(--f-ui); font-weight: 900; font-size: 50px; line-height: 1;
        padding: 12px 26px 14px; border-radius: 999px; background: var(--ink); color: var(--paper); white-space: nowrap;
      }

      /* 出力カード（novel-editor の出力。本文は明朝で一字一句） */
      .hf-card {
        display: block; position: relative; background: var(--paper); color: var(--ink);
        border: 5px solid var(--ink); box-shadow: 16px 16px 0 var(--ink); padding: 92px 64px 56px;
      }
      .hf-card > .hf-tag { position: absolute; left: 40px; top: -36px; }
      .hf-card-body { font-family: var(--f-mincho); font-weight: 700; font-size: 84px; line-height: 1.45; }

      /* 原稿（明朝） */
      .hf-ms { font-family: var(--f-mincho); font-weight: 400; color: var(--ink); font-size: 60px; line-height: 1.6; }
      .hf-ms p { display: block; }

      /* 取り消し線：背景の線を左から伸ばす（行をまたいでも順に走る）。strike() が background-size を動かす */
      .hf-strike {
        background-image: linear-gradient(var(--red), var(--red)); background-repeat: no-repeat;
        background-position: 0 58%; background-size: 0% 0.13em;
      }

      /* 判子（赤） */
      .hf-stamp {
        display: inline-block; color: var(--red); font-family: var(--f-mincho); font-weight: 700; line-height: 1.15;
        border: 12px solid var(--red); outline: 4px solid var(--red); outline-offset: 10px; padding: 26px 48px 30px;
        white-space: nowrap; background: rgba(243, 238, 227, 0.9);
      }

      /* チャットの吹き出し */
      .hf-bubble {
        display: block; position: relative; background: #FFFFFF; color: var(--ink); border: 5px solid var(--ink);
        border-radius: 48px 48px 8px 48px; box-shadow: 14px 14px 0 var(--ink); padding: 48px 60px 52px;
        font-family: var(--f-ui); font-weight: 500; font-size: 72px; line-height: 1.5;
      }
      .hf-chunk { opacity: 0; }
      .hf-nl { display: block; width: 0; height: 0; }
      .hf-caret { display: inline-block; width: 6px; height: 1em; vertical-align: -0.12em; background: var(--ink); margin-left: 4px; opacity: 0; }

      /* 赤ペン（SVG。先端が要素の左端中央に来る） */
      .hf-pen { position: absolute; width: 640px; height: 72px; transform-origin: 0% 50%; opacity: 0; }

      /* 手書きの線（scribble） */
      .hf-scrib { position: absolute; overflow: visible; pointer-events: none; }
      .hf-scrib path { fill: none; stroke: var(--red); stroke-linecap: round; stroke-linejoin: round; }

      /* 赤の書き込み文字 */
      .hf-pen-text { font-family: var(--f-pen); font-weight: 600; color: var(--red); }

      /* 数字 */
      .hf-num { display: inline-grid; font-family: var(--f-slam); font-variant-numeric: tabular-nums; }
      .hf-num > span { grid-area: 1 / 1; opacity: 0; text-align: right; }

      /* 白フラッシュなど全面の重ね */
      .hf-flash { position: absolute; inset: 0; opacity: 0; background: #FFFFFF; }

      /* 未実装シーンの仮表示 */
      .hf-placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
        background: var(--paper); color: rgba(20, 17, 15, 0.55); font-family: var(--f-ui); font-weight: 500; font-size: 56px; text-align: center; padding: 0 160px; }
      .hf-placeholder b { font-family: var(--f-slam); font-weight: 400; font-size: 96px; color: var(--ink); }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.4" data-fps="30" data-width="1920" data-height="1080">
      <div id="scene-s01-hook" class="clip scene" data-start="0" data-duration="6.4" data-track-index="1"></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="6.4" data-volume="1" data-track-index="0"></audio>
    </div>
    <script>window.HF_CONFIG = {"only":["s01-hook"],"offsetFrame":0,"totalFrames":192,"solo":true};</script>
    <script src="scenes/cues.js"></script>
    <script src="scenes/lib.js"></script>
    <script src="scenes/s01-hook.js"></script>
    <script src="scenes/s02-title.js"></script>
    <script src="scenes/s03-request.js"></script>
    <script src="scenes/s04-axes.js"></script>
    <script src="scenes/s05-rule.js"></script>
    <script src="scenes/s06-prose.js"></script>
    <script src="scenes/s07-emotion.js"></script>
    <script src="scenes/s08-ending.js"></script>
    <script src="scenes/s09-fix3.js"></script>
    <script src="scenes/s10-drill.js"></script>
    <script src="scenes/s11-proof-request.js"></script>
    <script src="scenes/s12-typos.js"></script>
    <script src="scenes/s13-norewrite.js"></script>
    <script src="scenes/s14-rapid.js"></script>
    <script src="scenes/s15-outro.js"></script>
    <script src="scenes/main.js"></script>
  </body>
</html>
